version: '3.8'

services:
  threatlens-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: threatlens-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER_URL=spark://spark-master:7077
      - POSTGRES_URL=postgresql://threatlens:soc_secure_pass@postgres:5432/threatlens_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - kafka
      - spark-master
      - postgres
      - redis
    networks:
      - threatlens-net

  threatlens-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: threatlens-frontend
    ports:
      - "3000:80"
    depends_on:
      - threatlens-backend
    networks:
      - threatlens-net

  # Kafka Distributed Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: threatlens-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - threatlens-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: threatlens-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - threatlens-net

  # Apache Spark Distributed Processing Cluster
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: threatlens-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - threatlens-net

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: threatlens-spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4G
    depends_on:
      - spark-master
    networks:
      - threatlens-net

  # Database & State Store
  postgres:
    image: postgres:16-alpine
    container_name: threatlens-postgres
    environment:
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: soc_secure_pass
      POSTGRES_DB: threatlens_db
    ports:
      - "5432:5432"
    networks:
      - threatlens-net

  redis:
    image: redis:7-alpine
    container_name: threatlens-redis
    ports:
      - "6379:6379"
    networks:
      - threatlens-net

networks:
  threatlens-net:
    driver: bridge
